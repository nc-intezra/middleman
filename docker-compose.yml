services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shim
      POSTGRES_PASSWORD: shim
      POSTGRES_DB: shim
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shim"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://shim:shim@db:5432/shim
    ports:
      - "8080:8080"
    command: uvicorn shim.main:app --host 0.0.0.0 --port 8080
