[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-shim"
version = "0.0.1"
description = "GPU Workload Shim — compute broker (Phase 0: inventory + ledger, read-only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# NVML/DCGM bindings; optional so the broker installs on hosts without an NVIDIA driver.
gpu = [
    "nvidia-ml-py>=12.535",
]

[project.scripts]
shim = "shim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's `Depends()` in a default argument is the intended pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The NVML collector deliberately swallows any error from the optional NVIDIA
# library so the broker runs on hosts with no driver.
"src/shim/inventory/nvml.py" = ["S110", "BLE001"]
